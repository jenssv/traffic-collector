name: Traffic collector

on:
  schedule:
    # Tiap 15 menit (jam UTC, tidak masalah karena data dicatat dalam WIB).
    # Menit 7/22/37/52 dipilih agar tidak bertabrakan dengan antrean di menit :00.
    - cron: "7 * * * *"
  workflow_dispatch: # tombol "Run workflow" untuk tes manual

permissions:
  contents: write

concurrency:
  group: traffic-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil data
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        run: python collector.py

      - name: Simpan ke repo
        run: |
          git config user.name "traffic-bot"
          git config user.email "traffic-bot@users.noreply.github.com"
          git add data/traffic.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: $(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M') WIB"
          git pull --rebase
          git push
